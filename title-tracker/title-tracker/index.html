<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Title Tracker</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; color: #fff;
                 font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
    [hidden] { display: none !important; }
    #bar { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; box-sizing: border-box; }
    #bar.drag { -webkit-app-region: drag; cursor: move; }
    button, input { -webkit-app-region: no-drag; }
    button { border: none; background: transparent; color: #aaa; cursor: pointer; width: 22px; height: 22px;
             padding: 0; font-size: 12px; }
    button:hover { color: #fff; }
    #title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #url { flex: 1; min-width: 0; background: #2d2d2d; color: #fff; border: 1px solid #555; border-radius: 3px;
           font: inherit; padding: 2px 4px; outline: none; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="lock" title="Blocca / sblocca">🔒</button>
    <span id="title">Inserisci un link…</span>
    <input id="url" hidden placeholder="Incolla il link e premi Invio" spellcheck="false">
    <button id="edit" title="Cambia link">✎</button>
    <button id="close" title="Chiudi">✕</button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>

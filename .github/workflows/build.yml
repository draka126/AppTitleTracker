name: Crea installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Trova il progetto
        id: find
        shell: bash
        run: echo "dir=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")" >> "$GITHUB_OUTPUT"
      - run: npm install
        working-directory: ${{ steps.find.outputs.dir }}
      - run: npx electron-builder --publish never
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            ${{ steps.find.outputs.dir }}/dist/*.exe
            ${{ steps.find.outputs.dir }}/dist/*.dmg
            ${{ steps.find.outputs.dir }}/dist/*.AppImage
